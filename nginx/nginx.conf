user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Additional Geospatial MIME Types
    types {
        application/geo+json                          geojson;
    }

    # Logging Format with Upstream and Latency Metrics
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_ext;

    # Optimization
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;

    # Buffer settings
    client_body_buffer_size      1m;
    client_header_buffer_size    4k;
    large_client_header_buffers  4 16k;

    # Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Note: Explicitly exclude image/tiff as COGs are already compressed
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/geo+json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Connection upgrade mapping for WebSockets / Long-lived connections
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
