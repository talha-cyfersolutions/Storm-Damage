# ==============================================================================
# NGINX Configuration for Storm Damage Imagery API
# ==============================================================================

upstream storm_api {
    # If using Docker Compose, use the service container name:
    server storm-damage-api:8000;

    # If running NGINX directly on the host (systemd), uncomment below:
    # server 127.0.0.1:8000;

    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g., api.yourdomain.com)

    # Allow Let's Encrypt / Certbot domain challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- Active HTTP proxy block (Comment this out once SSL is enabled above) ---
    include /etc/nginx/conf.d/storm-api-locations.include;
}

